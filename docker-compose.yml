services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mobility-lens-db
    environment:
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
      POSTGRES_DB: mobility_lens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d mobility_lens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
